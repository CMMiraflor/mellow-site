<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mellow: Your Music Companion</title>
<style>
  :root {
    --bg: #FAF6EF;
    --surface: #FFFFFF;
    --ink: #1F1A3D;
    --ink-soft: #5A5670;
    --accent: #2E2370;
    --mellow: #C6610A;
    --line: #E7DFD2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15122B;
      --surface: #1E1A3A;
      --ink: #F4F0FF;
      --ink-soft: #B9B3D6;
      --accent: #B7ACFF;
      --mellow: #F5A050;
      --line: #322C5C;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 72px;
  }
  .brand {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mellow);
    margin: 0 0 8px;
  }
  h1 {
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--accent);
    text-wrap: balance;
  }
  .date { color: var(--ink-soft); margin: 0 0 28px; }
  h2 {
    font-size: 21px;
    line-height: 1.3;
    margin: 36px 0 8px;
    color: var(--accent);
  }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 14px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  .summary {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin: 0 0 8px;
  }
  .summary p:last-child { margin-bottom: 0; }
  a { color: var(--accent); }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 15px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin: 0 0 14px;
  }
  .card p:last-child { margin-bottom: 0; }
  .hero { text-align: center; padding-top: 24px; }
  .hero img { width: 144px; height: 144px; border-radius: 32px; display: block; margin: 0 auto 20px; }
  .hero h1 { margin-bottom: 12px; }
  .hero p { color: var(--ink-soft); max-width: 460px; margin-left: auto; margin-right: auto; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
  .links a {
    display: inline-block; padding: 12px 20px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
<main class="hero">
  <img src="icon.png" alt="Mellow, a smiling orange music note">
  <p class="brand">By Ascented</p>
  <h1>Mellow: Your Music Companion</h1>
  <p>Play-along lessons in music and violin for every age, led by Mellow. For iPhone and iPad.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
  <footer><a href="support.html">Support</a> · <a href="privacy.html">Privacy Policy</a> · © 2026 Ascented</footer>
</main>
</body>
</html>
